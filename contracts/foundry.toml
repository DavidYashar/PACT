[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Named endpoints so the CLI flag can be short and the URL stays in .env.
[rpc_endpoints]
pact_mainnet = "${MAINNET_RPC_URL}"

# Blockscout verifiers (no API key needed — any placeholder works).
[etherscan]
4663 = { key = "verify", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
